<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Đăng nhập</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{
    background:#f5f6fa;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:28px;
    margin-bottom:15px;
}

</style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        🔐 Login
    </div>

    <div class="mb-3">
        <label class="form-label">
            Username
        </label>

        <input
            id="username"
            class="form-control"
            autocomplete="username">
    </div>

    <div class="mb-3">
        <label class="form-label">
            Password
        </label>

        <input
            type="password"
            id="password"
            class="form-control"
            autocomplete="current-password">
    </div>

    <div
        class="alert alert-danger d-none"
        id="msg">
    </div>

    <button
        class="btn btn-primary w-100"
        onclick="login()">

        Đăng nhập

    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const DEFAULT_URL =
"index.html";

const SUPABASE_URL =
"https://wdwwxqpdsrwcdnkyuqon.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkd3d4cXBkc3J3Y2Rua3l1cW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzI5MDcsImV4cCI6MjEwNjU0ODkwN30.VwixiepX6GBWPsdF8ZVd2055nCnp9fK8gaZqLeeExxs";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function showError(text){

    const m =
    document.getElementById(
        "msg"
    );

    m.classList.remove(
        "d-none"
    );

    m.innerText = text;
}

function saveSession(user){

    const now =
    new Date();

    const expire =
    new Date(
        now.getTime() +
        (
            7 * 24 * 60 * 60 * 1000
        )
    );

    const session = {

        id:
            user.id,

        username:
            user.username,

        fullname:
            user.fullname,

        role:
            user.role,

        status:
            user.status,

        loginTime:
            now.toISOString(),

        expireTime:
            expire.toISOString()
    };

    localStorage.setItem(
        "session",
        JSON.stringify(session)
    );
}

async function login(){

    document
    .getElementById("msg")
    .classList.add(
        "d-none"
    );

    const username =
    document
    .getElementById(
        "username"
    )
    .value
    .trim();

    const password =
    document
    .getElementById(
        "password"
    )
    .value;

    if(
        !username ||
        !password
    ){
        showError(
            "Vui lòng nhập Username và Password"
        );
        return;
    }

    const { data , error } =
    await db.rpc(
        "login_user",
        {
            p_username:
                username,

            p_password:
                password
        }
    );

    if(error){

        showError(
            error.message
        );

        return;
    }

    if(
        !data ||
        data.length === 0
    ){

        showError(
            "Sai tài khoản hoặc mật khẩu"
        );

        return;
    }

    const user =
    data[0];

    if(
        user.status !==
        "ACTIVE"
    ){

        showError(
            "Tài khoản đã bị khóa"
        );

        return;
    }

    saveSession(
        user
    );

    const next =
    new URLSearchParams(
        location.search
    )
    .get(
        "next"
    );

    location.href =
        next ||
        DEFAULT_URL;
}

document
.addEventListener(
"keydown",
e=>{

    if(
        e.key === "Enter"
    ){
        login();
    }

});

(function(){

    const raw =
    localStorage.getItem(
        "session"
    );

    if(!raw)
        return;

    try{

        const session =
        JSON.parse(raw);

        if(
            new Date(
                session.expireTime
            ) > new Date()
        ){

            const next =
            new URLSearchParams(
                location.search
            )
            .get(
                "next"
            );

            location.href =
            next ||
            DEFAULT_URL;
        }

    }
    catch{

        localStorage.removeItem(
            "session"
        );
    }

})();

</script>

</body>
</html>
