<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập – CuongLabs</title>
<script>try{if(localStorage.cl_dark==='1')document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
:root{--blue:#0b5cab;--page:#f5f6fa}
[data-bs-theme=dark]{--blue:#6ea8fe;--page:#14181f}
body{background:var(--page);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:400px;background:var(--bs-body-bg);border-radius:12px;padding:26px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.brand{text-align:center;font-weight:700;font-size:1.5rem;color:var(--blue);margin-bottom:4px}
.sub{text-align:center;color:var(--bs-secondary-color);margin-bottom:20px;font-size:.95rem}
.form-control{font-size:16px}
</style>
</head>
<body>

<form class="login-card" id="f" autocomplete="on" novalidate>
 <div class="brand">CuongLabs</div>
 <div class="sub">Đăng nhập để tiếp tục</div>

 <div class="mb-3">
  <label class="form-label" for="username">Tên đăng nhập</label>
  <input id="username" class="form-control" autocomplete="username" autocapitalize="none" autofocus>
 </div>

 <div class="mb-3">
  <label class="form-label" for="password">Mật khẩu</label>
  <div class="input-group">
   <input type="password" id="password" class="form-control" autocomplete="current-password">
   <button class="btn btn-outline-secondary" type="button" id="eye" title="Hiện / ẩn mật khẩu" aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button>
  </div>
 </div>

 <div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" id="rm" checked>
  <label class="form-check-label" for="rm">Ghi nhớ đăng nhập (7 ngày)</label>
 </div>

 <div class="alert alert-danger py-2 d-none" id="msg" role="alert"></div>

 <button class="btn btn-primary w-100" id="go" type="submit">Đăng nhập</button>
 <div class="text-center mt-3"><a class="small text-decoration-none" href="https://cuonglabs.github.io/tools/">← Về trang chủ</a></div>
</form>

<script src="auth.js"></script>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
const nextPath=CL.safeNext(q.get('next'));                         // chỉ chấp nhận địa chỉ trong /tools/ cùng tên miền
const go=()=>location.replace(nextPath?location.origin+nextPath:CL.BASE);

if(q.get('logout')==='1')CL.logout(false);
else if(CL.getSession())go();                                      // đã đăng nhập còn hạn thì chuyển luôn

function err(t){const m=$('msg');m.textContent=t;m.classList.remove('d-none')}

$('eye').onclick=()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('eye').textContent=show?'Ẩn':'Hiện'};

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  $('msg').classList.add('d-none');
  const u=$('username').value.trim(),p=$('password').value;
  if(!u||!p)return err('Vui lòng nhập tên đăng nhập và mật khẩu');
  const btn=$('go');btn.disabled=true;btn.textContent='Đang đăng nhập...';
  try{
    const data=await CL.rpc('login_user',{p_username:u,p_password:p});
    const user=data&&data[0];
    if(!user)throw new Error('BAD');
    if(String(user.status).toUpperCase()!=='ACTIVE')throw new Error('LOCKED');
    CL.saveSession(user,$('rm').checked);
    go();
  }catch(ex){
    console.error(ex);
    err(ex.message==='LOCKED'?'Tài khoản đã bị khóa'
       :ex.message==='BAD'?'Sai tên đăng nhập hoặc mật khẩu'
       :ex.message==='config'?'Chưa cấu hình server (không đọc được config.json)'
       :'Không đăng nhập được, vui lòng thử lại');           // không hiện chi tiết lỗi của server
    await new Promise(r=>setTimeout(r,1200));                 // chờ ngắn để hạn chế thử mật khẩu liên tục
  }finally{btn.disabled=false;btn.textContent='Đăng nhập'}
});
</script>
</body>
</html>
