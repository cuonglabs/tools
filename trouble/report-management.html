<!DOCTYPE html>
<html lang="vi" data-cl-themable>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý báo cáo</title>
<script src="https://cuonglabs.github.io/tools/auth/auth.js" data-require></script>
<script>try{if(localStorage.cl_dark==="1"||(localStorage.cl_dark==null&&localStorage.darkMode==="true"))document.documentElement.setAttribute("data-bs-theme","dark")}catch(e){}</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--blue:#0b5cab;--page:#f5f6fa}
[data-bs-theme=dark]{--blue:#6ea8fe;--page:#14181f}
body{background:var(--page);font-family:Arial,Helvetica,sans-serif}
.card-stat{border:0;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
.card-stat.on{outline:2px solid #0b5cab}
.box{background:var(--bs-body-bg);padding:15px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.table th,.table td{vertical-align:middle;white-space:nowrap;text-align:center}
.table td.s{white-space:normal;min-width:180px;max-width:320px;text-align:left}
.st{min-width:120px;font-weight:600}
@media(max-width:768px){h2{font-size:1.3rem}.table{font-size:.85rem}.btn{font-size:.8rem}}
</style>
</head>
<body>
<nav class="navbar bg-body shadow-sm sticky-top">
 <div class="container-fluid"><span id="cl-brand" data-title="Quản lý báo cáo"></span><div id="cl-account"></div></div>
</nav>
<div class="container-fluid p-3">
 <input id="who" type="hidden">
 <h4 class="mb-3">Quản lý báo cáo</h4>
 <div id="warn" class="alert alert-danger d-none"></div>

 <div class="row g-3 mb-3" id="stats"></div>

 <div class="box">
  <div class="row g-2 mb-3 align-items-end">
   <div class="col-12 col-md-4"><input id="q" class="form-control" placeholder="Tìm: số báo cáo, chủ đề, mã máy, người lập"></div>
   <div class="col-6 col-md-2"><select id="fSt" class="form-select"><option value="ALL">Tất cả (trừ đã xóa)</option><option>NEW</option><option>PROCESSING</option><option>DONE</option><option>REJECTED</option><option value="DELETED">Đã xóa</option></select></div>
   <div class="col-6 col-md-2"><input id="d1" type="date" class="form-control" title="Từ ngày"></div>
   <div class="col-6 col-md-2"><input id="d2" type="date" class="form-control" title="Đến ngày"></div>
   <div class="col-6 col-md-2 d-flex gap-1"><button class="btn btn-success flex-fill" id="bNew">+ Mới</button><button class="btn btn-primary flex-fill" id="bRef">Làm mới</button></div>
  </div>
  <div class="table-responsive">
   <table class="table table-bordered table-hover">
    <thead class="table-dark"><tr><th>Số báo cáo</th><th>Chủ đề</th><th>Mã máy</th><th>Trạng thái</th><th>Tạo lúc</th><th>Sửa cuối</th><th>Thao tác</th></tr></thead>
    <tbody id="tb"><tr><td colspan="7" class="text-muted">Đang tải...</td></tr></tbody>
   </table>
  </div>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
   <div class="small text-muted" id="info"></div>
   <div class="d-flex align-items-center gap-2">
    <select id="ps" class="form-select form-select-sm" style="width:auto"><option>10</option><option selected>20</option><option>50</option></select>
    <button class="btn btn-outline-secondary btn-sm" id="pPrev">‹ Trước</button><button class="btn btn-outline-secondary btn-sm" id="pNext">Sau ›</button>
   </div>
  </div>
 </div>
</div>

<div id="cl-footer"></div>

<div class="modal fade" id="vm" tabindex="-1"><div class="modal-dialog modal-xl modal-fullscreen-md-down"><div class="modal-content">
 <div class="modal-header py-2"><h5 class="modal-title" id="vt">Xem báo cáo</h5><a class="btn btn-sm btn-outline-primary ms-auto me-2" id="vo" target="_blank">Mở tab mới</a><button class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body p-0"><iframe id="vf" style="width:100%;height:78vh;border:0"></iframe></div>
</div></div></div>

<div class="toast position-fixed top-0 end-0 m-3" id="tst"><div class="toast-body" id="tm"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cuonglabs.github.io/tools/layout.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STS=['NEW','PROCESSING','DONE','REJECTED'];
const COL={NEW:'#cfe2ff',PROCESSING:'#fff3cd',DONE:'#d1e7dd',REJECTED:'#f8d7da',DELETED:'#e2e3e5'};
const SEL='id,reportno,status,createby,createtime,modifiedby,modifiedtime,subject:content->>subject,mc:content->>mc';
let CFG={url:'',key:'',app:'bao-cao-ky-thuat.html'},page=0,total=0,tq,tr;
const P={st:false,del:false,ed:false,cr:false};   // quyền theo vai trò (xem auth.js)

function toast(m){$('tm').textContent=m;bootstrap.Toast.getOrCreateInstance($('tst'),{delay:3000}).show()}
function warn(m){const w=$('warn');w.textContent=m||'';w.classList.toggle('d-none',!m)}
const hdr=x=>{const h={apikey:CFG.key,'Content-Type':'application/json',...(x||{})};if(/^eyJ/.test(CFG.key))h.Authorization='Bearer '+CFG.key;return h};
async function api(path,opt={}){
  const r=await fetch(CFG.url+'/rest/v1/'+path,{...opt,headers:hdr(opt.headers)}),t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('HTTP '+r.status));
  return{j,range:r.headers.get('content-range')||''};
}
const appUrl=q=>new URL(CFG.app,location.href).href+(q||'');
function fmt(v){if(!v)return'';const d=new Date(v),p=n=>String(n).padStart(2,'0'),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' '+p(d.getDate())+'-'+m[d.getMonth()]+'-'+d.getFullYear()}

function filters(){
  let f='';const st=$('fSt').value;
  f+=st==='ALL'?'&status=neq.DELETED':'&status=eq.'+st;
  const kw=$('q').value.trim();
  if(kw){const q='"*'+kw.replace(/[\\"]/g,'\\$&')+'*"';
    f+='&or='+encodeURIComponent('(reportno.ilike.'+q+',createby.ilike.'+q+',content->>subject.ilike.'+q+',content->>mc.ilike.'+q+')')}
  const a=$('d1').value,b=$('d2').value;
  if(a)f+='&createtime=gte.'+encodeURIComponent(new Date(a+'T00:00:00').toISOString());
  if(b)f+='&createtime=lt.'+encodeURIComponent(new Date(new Date(b+'T00:00:00').getTime()+864e5).toISOString());
  return f;
}
async function count(f){const r=await api('reports?select=id&limit=1'+f,{headers:{Prefer:'count=exact'}});return+(r.range.split('/')[1])||0}
async function stats(){
  const defs=[['Tổng','&status=neq.DELETED','ALL'],...STS.map(s=>[s,'&status=eq.'+s,s])];
  const n=await Promise.all(defs.map(d=>count(d[1])));
  $('stats').innerHTML=defs.map((d,i)=>`<div class="col-6 col-md"><div class="card card-stat ${$('fSt').value===d[2]?'on':''}" data-st="${d[2]}"><div class="card-body text-center py-3"><div>${d[0]}</div><h3 class="m-0">${n[i]}</h3></div></div></div>`).join('');
}
async function load(){
  if(!CFG.url||!CFG.key)return warn('Chưa cấu hình server: điền supabaseUrl và anonKey trong config.json (cùng thư mục với trang này).');
  try{
    warn('');const ps=+$('ps').value;
    const {j,range}=await api('reports?select='+encodeURIComponent(SEL)+'&order=createtime.desc&limit='+ps+'&offset='+page*ps+filters(),{headers:{Prefer:'count=exact'}});
    total=+(range.split('/')[1])||0;
    $('tb').innerHTML=j.length?j.map(r=>{const del=r.status==='DELETED',opts=(del?[...STS,'DELETED']:STS);
      return`<tr><td>${esc(r.reportno)}</td><td class="s">${esc(r.subject)}</td><td>${esc(r.mc)}</td>
      <td><select class="form-select form-select-sm st" ${P.st?'':'disabled'} data-id="${esc(r.id)}" style="background:${COL[r.status]||'#fff'}">${opts.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td class="small">${esc(r.createby)}<br>${fmt(r.createtime)}</td><td class="small">${r.modifiedtime?esc(r.modifiedby)+'<br>'+fmt(r.modifiedtime):''}</td>
      <td><button class="btn btn-info btn-sm" data-a="view" data-id="${esc(r.id)}" data-no="${esc(r.reportno)}">Xem</button>
      ${P.ed?`<button class="btn btn-warning btn-sm" data-a="edit" data-id="${esc(r.id)}">Sửa</button>`:''}
      <button class="btn btn-outline-secondary btn-sm" data-a="link" data-id="${esc(r.id)}">Link</button>
      ${!P.del?'':del?`<button class="btn btn-success btn-sm" data-a="res" data-id="${esc(r.id)}">Khôi phục</button>`:`<button class="btn btn-danger btn-sm" data-a="del" data-id="${esc(r.id)}">Xóa</button>`}</td></tr>`}).join('')
      :'<tr><td colspan="7" class="text-muted">Không có báo cáo nào.</td></tr>';
    const pages=Math.max(1,Math.ceil(total/ps));
    $('info').textContent=total+' báo cáo · trang '+(page+1)+'/'+pages;
    $('pPrev').disabled=page<=0;$('pNext').disabled=page+1>=pages;
    stats();
  }catch(e){warn('Không tải được danh sách: '+e.message)}
}
async function setStatus(id,st,ask){
  if(ask&&!confirm('Xóa báo cáo này? Báo cáo chỉ bị ẩn khỏi danh sách và có thể khôi phục.'))return load();
  let who=$('who').value.trim()||prompt('Nhập tên của bạn (ghi vào "người sửa cuối"):');
  if(!who)return load();
  $('who').value=who;localStorage.fjk_operator=who;
  try{
    const r=await api('reports?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status:st,modifiedby:who})});
    if(!r.j||!r.j.length)throw new Error('Không cập nhật được (không tìm thấy báo cáo hoặc không có quyền)');
    toast(st==='DELETED'?'Đã xóa (ẩn) báo cáo':'Đã đổi trạng thái: '+st);
  }catch(e){warn('Lỗi: '+e.message)}
  load();
}
async function copy(s){try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(s);else throw 0}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Đã sao chép link xem')}

$('tb').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  if(a==='view'){const u=appUrl('?view='+encodeURIComponent(id));$('vt').textContent='Báo cáo '+b.dataset.no;$('vo').href=u;$('vf').src=u;bootstrap.Modal.getOrCreateInstance($('vm')).show()}
  if(a==='edit')open(appUrl('?edit='+encodeURIComponent(id)),'_blank');
  if(a==='link')copy(appUrl('?view='+encodeURIComponent(id)));
  if(a==='del')setStatus(id,'DELETED',true);
  if(a==='res')setStatus(id,'NEW');
});
$('tb').addEventListener('change',e=>{const s=e.target.closest('.st');if(s)setStatus(s.dataset.id,s.value)});
$('stats').addEventListener('click',e=>{const c=e.target.closest('[data-st]');if(c){$('fSt').value=c.dataset.st;page=0;load()}});
$('vm').addEventListener('hidden.bs.modal',()=>{$('vf').src='about:blank'});
$('bNew').onclick=()=>open(appUrl(),'_blank');
$('bRef').onclick=()=>load();
$('q').oninput=()=>{clearTimeout(tq);tq=setTimeout(()=>{page=0;load()},350)};
for(const id of ['fSt','d1','d2','ps'])$(id).onchange=()=>{page=0;load()};
$('pPrev').onclick=()=>{page--;load()};$('pNext').onclick=()=>{page++;load()};

(async()=>{
  if(!window.CL){warn('Không tải được module đăng nhập (auth.js). Trang quản lý tạm khóa.');$('tb').innerHTML='';return}
  const s=CL.getSession();if(!s)return;                       // auth.js đã chuyển sang trang đăng nhập
  $('who').value=CL.userName();
  Object.assign(P,{st:CL.can('status'),del:CL.can('delete'),ed:CL.can('edit'),cr:CL.can('create')});
  $('bNew').style.display=P.cr?'':'none';
  try{const r=await fetch('config.json',{cache:'no-cache'});if(r.ok){const j=await r.json();
    CFG.url=(j.supabaseUrl||'').replace(/\/+$/,'');CFG.key=(j.anonKey||'').trim();if(j.appUrl)CFG.app=j.appUrl}}catch(e){}
  await load();
  if(CFG.url&&CFG.key){
    if(window.supabase){try{supabase.createClient(CFG.url,CFG.key).channel('reports')
      .on('postgres_changes',{event:'*',schema:'public',table:'reports'},()=>{clearTimeout(tr);tr=setTimeout(()=>{load();toast('Có báo cáo vừa thay đổi')},800)}).subscribe()}catch(e){}}
    else setInterval(()=>{if(!document.hidden)load()},30000);
  }
})();
</script>
</body>
</html>
