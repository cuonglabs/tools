<!DOCTYPE html>
<html lang="vi" data-bs-theme="light" data-cl-themable>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CuongLabs</title>
<link rel="icon" href="https://raw.githubusercontent.com/cuonglabs/tools/main/favicon.ico">
<script>try{if(localStorage.cl_dark==='1'||(localStorage.cl_dark==null&&localStorage.darkMode==='true'))document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--blue:#0b5cab;--page:#f5f6fa}
[data-bs-theme=dark]{--blue:#6ea8fe;--page:#14181f}
body{background:var(--page);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.kpi,.tool{border:0;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);background:var(--bs-body-bg)}
.tool{transition:transform .2s,box-shadow .2s}
.tool:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.ico{width:60px;height:60px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem}
.kpi h3{margin:0;color:var(--blue)}
#cl-footer{margin-top:auto}
</style>
</head>
<body data-cl-bg>

<nav class="navbar bg-body shadow-sm sticky-top">
 <div class="container-fluid"><span id="cl-brand"></span><div id="cl-account"></div></div>
</nav>

<main class="container my-4">
 <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
  <div><h4 class="m-0" id="hello"></h4><div class="text-muted small" id="sub"></div></div>
  <input id="searchInput" class="form-control" style="max-width:340px" placeholder="Tìm công cụ..." autocomplete="off">
 </div>

 <a class="text-decoration-none text-reset" id="statsLink" target="_blank" rel="noopener">
  <div class="row g-3 mb-4">
   <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body text-center py-3"><div>Tổng báo cáo</div><h3 id="kTotal">–</h3></div></div></div>
   <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body text-center py-3"><div>NEW</div><h3 id="kNew">–</h3></div></div></div>
   <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body text-center py-3"><div>PROCESSING</div><h3 id="kProc">–</h3></div></div></div>
   <div class="col-6 col-md-3"><div class="card kpi"><div class="card-body text-center py-3"><div>DONE</div><h3 id="kDone">–</h3></div></div></div>
  </div>
 </a>

 <div class="row g-3" id="tools"></div>
</main>

<div id="cl-footer"></div>

<script src="https://cuonglabs.github.io/tools/auth/auth.js"></script>
<script src="https://cuonglabs.github.io/tools/layout.js"></script>
<script>
const BASE='https://cuonglabs.github.io/tools/';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
const TOOLS=(window.CL&&CL.TOOLS)||[];

function renderHello(){
  const s=window.CL&&CL.getSession&&CL.getSession(),n=s?(s.fullname||s.username):'';
  $('hello').textContent=n?'Xin chào, '+n:'Chào mừng đến CuongLabs';
  $('sub').textContent=TOOLS.length+' công cụ';
}
function renderTools(){
  const k=norm($('searchInput').value.trim()),list=TOOLS.filter(t=>norm(t.name+' '+t.desc).includes(k));
  $('tools').innerHTML=list.length?list.map(t=>`<div class="col-6 col-md-4 col-lg-3"><a class="card tool text-decoration-none h-100" href="${esc(t.url)}" target="_blank" rel="noopener"><div class="card-body text-center py-4"><div class="ico bg-${t.color}-subtle text-${t.color}-emphasis"><i class="bi ${t.icon}"></i></div><h6 class="mt-3 mb-1 text-body">${esc(t.name)}</h6><div class="small text-muted">${esc(t.desc)}</div></div></a></div>`).join('')
    :'<div class="col-12 text-center text-muted py-4">Không tìm thấy công cụ.</div>';
  return list;
}
async function loadStats(){
  try{
    const c=await(await fetch(BASE+'trouble/config.json',{cache:'no-cache'})).json(),U=(c.supabaseUrl||'').replace(/\/+$/,''),K=(c.anonKey||'').trim();
    if(!U||!K)throw 0;
    const H={apikey:K,Prefer:'count=exact'};if(/^eyJ/.test(K))H.Authorization='Bearer '+K;
    const cnt=async f=>{const r=await fetch(U+'/rest/v1/reports?select=id&limit=1'+f,{headers:H});if(!r.ok)throw 0;return+(r.headers.get('content-range')||'').split('/')[1]||0};
    const[a,b,p,d]=await Promise.all([cnt('&status=neq.DELETED'),cnt('&status=eq.NEW'),cnt('&status=eq.PROCESSING'),cnt('&status=eq.DONE')]);
    $('kTotal').textContent=a;$('kNew').textContent=b;$('kProc').textContent=p;$('kDone').textContent=d;
  }catch(e){}
}
$('statsLink').href=BASE+'trouble/report-management.html';
$('searchInput').oninput=renderTools;
$('searchInput').onkeydown=e=>{if(e.key==='Enter'){const l=renderTools();if(l[0])open(l[0].url,'_blank')}};
document.addEventListener('cl:session',renderHello);
renderHello();renderTools();loadStats();
</script>
</body>
</html>
